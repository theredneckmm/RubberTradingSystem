name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0'

    # Project ကို Release Mode ဖြင့် Publish လုပ်ခြင်း
    - name: Publish .NET Core Project
      run: dotnet publish RubberTradingSystem.csproj -c Release -o release --nologo

    # GitHub Pages အတွက် .nojekyll ဖိုင်ထည့်ခြင်း
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    # Base path များကို GitHub Pages တွင် အလုပ်လုပ်စေရန် index.html ကို base tag ထည့်ခြင်း (သို့မဟုတ် index.html ကို 404.html အဖြစ် Copy ကူးခြင်း)
    - name: Copy index.html to 404.html for SPA routing
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # gh-pages branch သို့ Deploy လုပ်ခြင်း
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: release/wwwroot