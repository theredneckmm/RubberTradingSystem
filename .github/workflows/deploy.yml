name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore
      - name: Restore
        run: dotnet restore RubberTradingSystem.csproj

      # 4. Publish
      - name: Publish
        run: dotnet publish RubberTradingSystem.csproj -c Release -o release --nologo

      # 5. Check published files
      - name: Check publish output
        run: |
          echo "===== RELEASE ====="
          ls -la release

          echo "===== WWWROOT ====="
          ls -la release/wwwroot

          echo "===== FRAMEWORK ====="
          ls -la release/wwwroot/_framework

      # 6. Add .nojekyll
      - name: Add .nojekyll
        run: |
          touch release/wwwroot/.nojekyll

      # 7. SPA fallback
      - name: Create 404.html
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html

      # 8. Deploy to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release/wwwroot
          publish_branch: gh-pages
          force_orphan: true